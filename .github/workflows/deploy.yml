name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Pull latest code on PythonAnywhere
        env:
          USERNAME: ${{ secrets.PA_USERNAME }}
          API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          DOMAIN: ${{ secrets.PA_DOMAIN }}
        run: |
          curl -s -X POST "https://www.pythonanywhere.com/api/v0/user/$USERNAME/consoles/" \
            -H "Authorization: Token $API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"executable\": \"bash\", \"arguments\": \"-c 'cd ~/$DOMAIN && git pull origin main && source virtualenv/bin/activate && python manage.py collectstatic --noinput --clear 2>&1'\", \"working_directory\": \"/home/$USERNAME\"}"
          sleep 30

      - name: Reload web app
        env:
          USERNAME: ${{ secrets.PA_USERNAME }}
          API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          DOMAIN: ${{ secrets.PA_DOMAIN }}
        run: |
          curl -s -X POST "https://www.pythonanywhere.com/api/v0/user/$USERNAME/webapps/$DOMAIN/reload/" \
            -H "Authorization: Token $API_TOKEN"
          echo "Web app reloaded successfully"
